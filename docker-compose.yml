version: '3.8'

services:
  youtube-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube_automation_studio
    restart: unless-stopped
    ports:
      - "3456:3456"
    environment:
      - PORT=3456
      - NODE_ENV=production
      - OMNIROUTE_BASE_URL=https://johonapi.junoverseai.com/v1
      - OMNIROUTE_API_KEY=sk-54c433c8a5b955a8-921a07-1ca6bc8e
      - OMNIROUTE_CHAT_MODEL=antigravity/gemini-3.6-flash-high
      - ACTIVE_PROFILE=sayed_johon
      - YOUTUBE_PRIVACY_STATUS=public
      - REPO_COUNT=6
      - FFMPEG_THREADS=3
    cpus: 3.0
    mem_limit: 8g
    volumes:
      - ./config:/app/config
      - ./logs:/app/logs
      - ./data:/app/data
      - /media/joe/Storage/Videos/automated-segment-github:/app/data/videos
      - /media/joe/Storage/user_cache/automated-segment-github:/app/data/cache
